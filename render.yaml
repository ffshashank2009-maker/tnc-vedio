##############################################################################
# Render Infrastructure-as-Code
# Docs: https://render.com/docs/blueprint-spec
#
# One web service — Express API + static React frontend served from the same process.
#
# Required env vars (set in Render dashboard → Environment):
#   SUPABASE_URL        Supabase project URL
#   SUPABASE_SERVICE_ROLE_KEY  Supabase server-only service-role key
#   SUPABASE_ANON_KEY   Supabase public anon key (safe to expose to browsers)
#   RESEND_API_KEY      Resend API key for access decision notifications
#   ACCESS_EMAIL_FROM   Verified Resend sender, e.g. TNC Nursing <access@your-domain>
#   ADMIN_PASSWORD      Admin panel password
#   ADMIN_TOKEN         Admin panel token
#   SESSION_SECRET      Express session secret
#   TELEGRAM_BOT_TOKEN  (optional) Telegram bot token
#   ADMIN_CHAT_ID       (optional) Telegram admin chat ID
##############################################################################

services:
  - type: web
    name: tnc-nursing-app
    runtime: node
    region: oregon          # change to your preferred region
    plan: free              # change to starter/standard for production

    buildCommand: bash build.sh
    startCommand: node --enable-source-maps artifacts/api-server/dist/index.mjs

    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"        # Render assigns this automatically; keep in sync
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false           # set manually in dashboard
      - key: SUPABASE_ANON_KEY
        sync: false           # public browser key; never use the service-role key here
      - key: RESEND_API_KEY
        sync: false
      - key: ACCESS_EMAIL_FROM
        sync: false           # must be a verified sender in Resend
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: ADMIN_CHAT_ID
        sync: false
      - key: RENDER_URL
        # Injected at runtime: your app's public URL (https://tnc-nursing-app.onrender.com)
        # Used by the Telegram bot to auto-register its webhook on startup.
        # Set this to your Render service URL after first deploy.
        sync: false
      - key: PUBLIC_APP_URL
        value: https://courses.tncnursing.site
